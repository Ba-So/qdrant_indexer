# Example Qdrant Indexer configuration file
# Copy to your project root as .qdrant-indexer.toml

[qdrant]
# Qdrant server URL (can be overridden with QDRANT_URL env var)
url = "http://localhost:6333"

[embedding]
# FastEmbed model name
# Default: sentence-transformers/all-MiniLM-L6-v2 (384 dimensions)
# Other options:
#   - BAAI/bge-small-en-v1.5 (384 dimensions)
#   - sentence-transformers/all-mpnet-base-v2 (768 dimensions)
model = "sentence-transformers/all-MiniLM-L6-v2"

# Optional: custom cache directory for model files
# cache_dir = "/path/to/cache"

[chunking]
# Chunking strategy: "recursive" or "fixed"
strategy = "recursive"

# Maximum chunk size in characters
chunk_size = 512

# Overlap between consecutive chunks
chunk_overlap = 50

[indexing]
# Number of points to upload per batch
batch_size = 100

# Default glob pattern for file discovery
pattern = "**/*.md"

# Additional patterns to exclude (on top of defaults)
exclude_patterns = [
    "draft/**",
    "archive/**",
    "*.draft.md",
]
