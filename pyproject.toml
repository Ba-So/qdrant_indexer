[project]
name = "qdrant-indexer"
version = "0.1.0"
description = "Index documentation into Qdrant vector database for semantic search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qdrant-client>=1.12.0",
    "fastembed>=0.6.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pymupdf>=1.24.0",
    "python-frontmatter>=1.0.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-php>=0.23.0",
    "typing-extensions>=4.8.0,<4.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "tree-sitter-python>=0.23.0",
]

[project.scripts]
qdrant-indexer = "qdrant_indexer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qdrant_indexer"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require running Qdrant)",
    "performance: marks tests as performance tests (may take 30-60s each)",
]
testpaths = ["tests"]
